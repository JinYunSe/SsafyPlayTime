plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.6'
}

group = 'com.ssafyplaytime'
version = '0.0.1-SNAPSHOT'
description = 'ssafyplaytime'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    protobufVersion = '4.33.5'
}

dependencies {
    // --- Web + WebSocket (Binary frames) ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // --- Validation / Redis ---
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // --- Ops (optional) ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- Persistence (JPA 선택 시) ---
    //DB 붙이기 전 임시로 비활성화
    //implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    //runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Protobuf (버전 정렬) ---
    implementation platform("com.google.protobuf:protobuf-bom:${protobufVersion}")
    implementation 'com.google.protobuf:protobuf-java'
    implementation 'com.google.protobuf:protobuf-java-util'

    // --- Lombok (버전은 Spring Boot BOM에 맡김) ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Tests ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'com.redis:testcontainers-redis' // Boot가 버전 관리(예: 2.2.4) :contentReference[oaicite:4]{index=4}
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
